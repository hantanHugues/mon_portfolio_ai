<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4444c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3333b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond bleu avec coins arrondis -->
  <rect x="4" y="4" width="32" height="32" rx="6" fill="url(#bgGradient)"/>
  
  <!-- Lettres H et N géométriques (reproduction exacte de l'image) -->
  <g stroke="black" stroke-width="1.5" stroke-linecap="butt" fill="none">
    <!-- Ligne Verticale H (gauche, la plus longue) -->
    <line x1="9" y1="10" x2="9" y2="30"/>
    
    <!-- Ligne Verticale N (droite, plus courte) -->
    <line x1="25" y1="10" x2="25" y2="25"/>
    
    <!-- Ligne Horizontale (haut, la plus longue) -->
    <line x1="9" y1="10" x2="31" y2="10"/>
    
    <!-- Ligne Horizontale (milieu, plus courte) -->
    <line x1="9" y1="18" x2="27" y2="18"/>
    
    <!-- Ligne Diagonale caractéristique -->
    <line x1="9" y1="10" x2="25" y2="25"/>
  </g>
  
  <!-- Texte HANTAN -->
  <text x="42" y="16" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="currentColor" opacity="0.9">
    HANTAN
  </text>
  <text x="42" y="28" font-family="'Poppins', sans-serif" font-size="8" font-weight="400" fill="currentColor" opacity="0.7">
    DEVELOPER
  </text>
  
  <!-- Éléments décoratifs -->
  <circle cx="105" cy="12" r="1" fill="url(#bgGradient)" opacity="0.6"/>
  <circle cx="110" cy="18" r="1.5" fill="url(#bgGradient)" opacity="0.5"/>
  <circle cx="108" cy="28" r="1" fill="url(#bgGradient)" opacity="0.4"/>
</svg>
