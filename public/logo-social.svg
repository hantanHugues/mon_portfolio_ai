<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socialBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4444c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond bleu uniforme avec coins arrondis -->
  <rect width="400" height="400" rx="80" fill="url(#socialBgGradient)"/>
  
  <!-- Dessin du symbole élargi - VOTRE CODE EXACT -->
  <g stroke="black" stroke-width="18" stroke-linecap="round" fill="none">
    <!-- Ligne verticale gauche -->
    <line x1="80" y1="60" x2="80" y2="260"/>
    <!-- Ligne horizontale haute -->
    <line x1="80" y1="60" x2="320" y2="60"/>
    <!-- Ligne horizontale du milieu -->
    <line x1="80" y1="150" x2="270" y2="150"/>
    <!-- Ligne verticale centrale -->
    <line x1="180" y1="60" x2="180" y2="260"/>
    <!-- Diagonale -->
    <line x1="80" y1="60" x2="180" y2="260"/>
    <!-- Ligne horizontale du F -->
    <line x1="180" y1="150" x2="300" y2="150"/>
  </g>
  
  <!-- Éléments décoratifs -->
  <circle cx="60" cy="60" r="8" fill="white" opacity="0.3"/>
  <circle cx="340" cy="60" r="12" fill="white" opacity="0.2"/>
  <circle cx="60" cy="340" r="10" fill="white" opacity="0.25"/>
  <circle cx="360" cy="360" r="6" fill="white" opacity="0.4"/>
  
  <!-- Texte */
  <text x="200" y="340" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="white" text-anchor="middle" opacity="0.9">
    HANTAN
  </text>
  <text x="200" y="370" font-family="'Poppins', sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" opacity="0.7">
    DEVELOPER
  </text>
</svg>
