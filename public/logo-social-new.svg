<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4444c8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond avec coins arrondis -->
  <rect width="400" height="400" rx="80" fill="url(#socialGradient)"/>
  
  <!-- Lignes géométriques blanches (grande taille) -->
  <g stroke="white" stroke-width="12" stroke-linecap="round">
    <!-- Ligne Verticale (gauche, la plus longue) -->
    <line x1="120" y1="80" x2="120" y2="320"/>
    
    <!-- Ligne Verticale (droite, plus courte) -->
    <line x1="240" y1="80" x2="240" y2="250"/>
    
    <!-- Ligne Horizontale (haut, la plus longue) -->
    <line x1="120" y1="80" x2="380" y2="80"/>
    
    <!-- Ligne Horizontale (milieu, plus courte) -->
    <line x1="120" y1="180" x2="310" y2="180"/>
    
    <!-- Ligne Diagonale caractéristique -->
    <line x1="120" y1="80" x2="240" y2="250"/>
  </g>
  
  <!-- Éléments décoratifs -->
  <circle cx="60" cy="60" r="8" fill="white" opacity="0.3"/>
  <circle cx="340" cy="60" r="12" fill="white" opacity="0.2"/>
  <circle cx="60" cy="340" r="10" fill="white" opacity="0.25"/>
  <circle cx="360" cy="360" r="6" fill="white" opacity="0.4"/>
  
  <!-- Texte -->
  <text x="200" y="340" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="white" text-anchor="middle" opacity="0.9">
    HANTAN
  </text>
  <text x="200" y="370" font-family="'Poppins', sans-serif" font-size="18" font-weight="400" fill="white" text-anchor="middle" opacity="0.7">
    DEVELOPER
  </text>
</svg>
